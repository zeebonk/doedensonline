  home:
    index:
      intro_html: "Dit is de homepage van Doedens Online. Hieronder vind u de drie laatst geplaatste nieuws berichtjes. U kunt via het hoofd menu boven aan de pagina naar de andere onderdelen van de site, of u kunt via een \"lees verder\" link bij een nieuws berichtje direct het hele bericht bekijken. Wilt u meer informatie over hoe de website te gebruiken? Bekijk dan de <a href=\"/media/handleiding.doc\" title=\"Gebruikers handleiding (.doc)\">handleiding</a>."
      read_more: "Lees verder »"
      read_more_title: "Lees de rest van dit bericht"
      zandvaart_alt: "Zandvaart 7"
    sign_in:
      intro: "Welkom op DoedensOnline.nl. De website van de famillie Doedens. Om verder te gaan op deze website moet u eerst inloggen. Inloggen kunt u doen met het inlog formulier hieronder."
      first_name: "Voornaam"
      password: "Wachtwoord"
      forgot_password: "Wachtwoord vergeten?"
      forgot_password_title: "Vraag een nieuw wachtwoord aan"
      submit: "Log in..."
    sign_out:
      intro: "Bent u weer helemaal op de hoogte van de familie en is het weer tijd om wat anders te gaan doen? Log dan eerst uit! Met het uitloggen zorgt u er voor dat wanneer de website weer word geopend op uw computer, er eerst weer moet worden ingelogd om verder de site op te kunnen!"
      confirmation: "Weet u zeker dat u wilt uitloggen?"
      confirm: "Ja, log mij uit!"
      cancel: "Nee, ik blijf nog even!"
    password_forgotten:
      intro: "Bent u uw wachtwoord vergeten? U kunt met het \"wachtwoord vergeten formulier\" hieronder een nieuw wachtwoord aanvragen. Wanneer u uw voornaam en emailadres heeft ingevuld word er een nieuw email adres voor u aangemaakt, deze krijg u vervolgens naar uw email adres gestuurd."
      first_name: "Voornaam"
      email: "E-mail"
      submit: "Reset mijn wachtwoord..."

  news:
    index:
      intro: "Bij het nieuwtjes overzicht kunt u door alle geplaatste nieuwtjes bladeren. De nieuwtjes zijn gesorteerd op datum, waarbij de nieuwste berichten altijd bovenaan staan. Via de pagina navigatie (rechts onder deze tekst) kunt u ook oudere berichten terug zien. Via de link \"Nieuwtje toevoegen\" (links onder deze tekst), kunt u naar het scherm gaan om een nieuw bericht te plaatsen."
      add: "Nieuwtje toevoegen »"
      add_title: "Plaats een nieuw nieuwtje"
      view_comments: "Bekijk/plaats reacties (%{count}) »"
      view_comments_title: "Bekijk het hele bericht en lees/schrijf reacties"
      remove: "Verwijderen » "
      remove_title: "Verwijder dit complete bericht"
      edit: "Aanpassen » "
      edit_title: "Pas dit bericht aan"
    add:
      intro: "Op deze pagina kunt u een nieuw nieuwtje aanmaken. Typ uw verhaal in het tekstvak hieronder en druk op \"Plaats nieuwtje\". Uw verhaal zal bovenaan de lijst met nieuwtjes worden geplaatst."
      placeholder: "Hier uw tekst"
      submit: "Plaats nieuwtje"
      back: "« Terug naar het overzicht"
      back_title: "Keer terug naar het nieuwtjes overzicht"
    edit:
      intro: "Op deze pagina kunt u een reeds eerder aangemaakt nieuwtje aanpassen. Vergeet niet op de knop \"Wijzigingen opslaan...\" te klikken zodat uw wijzigen ook daadwerkelijk doorgevoerd worden."
      submit: "Wijzigingen opslaan..."
      back: "« Terug naar het overzicht"
      back_title: "Keer terug naar het nieuwtjes overzicht"
    remove:
      confirmation: "Weet u zeker dat u dit nieuwtje wilt verwijderen?"
      confirm: "Ja, verwijderen"
      cancel: "Nee, niet verwijderen"
    view:
      intro: "Op deze pagina bekijkt u een nieuwtje, inclusief alle bijhorende reacties. Hier kunt u zelf ook reacties plaatsen bij een nieuwtje, dit doet u door op \"Reactie plaatsen\" te klikken. Wanneer u weer terug wilt keren naar het nieuwtjes overzicht kunt u dit doen door op \"Terug naar het overzicht\" te klikken of in het hoofd menu \"Nieuwtjes\" aan te klikken."
      back: "« Terug naar het overzicht"
      back_title: "Keer terug naar het nieuwtjes overzicht"
      add_comment: "Reactie plaatsen »"
      add_comment_title: "Plaats een reactie op dit bericht"
      remove: "Verwijderen » "
      remove_title: "Verwijder dit complete bericht"
      edit: "Aanpassen » "
      edit_title: "Pas dit bericht aan"
      remove_comment: "Verwijderen »"
      remove_comment_title: "Verwijder deze reactie"
      edit_comment: "Aanpassen »"
      edit_comment_title: "Pas deze reactie aan"
    add_comment:
      intro: "Op deze pagina kunt u een nieuwe reactie aanmaken. Typ uw reactie in het tekstvak hieronder en druk op \"Reactie plaatsen\". Uw reactie zal bovenaan de lijst met reacties worden geplaatst."
      placeholder: "Hier uw reactie"
      submit: "Reactie plaatsen"
      back: "« Terug naar het nieuwtje"
      back_title: "Keer terug naar het nieuwtje waarop u wilde reageren"
    edit_comment:
      intro: "Op deze pagina kunt u een door u geplaatste reactie aanpassen. Verander uw reactie en druk op \"Aanpassen\". Uw aanpassingen worden direct doorgevoerd.\""
      submit: "Aanpassen"
      back: "« Terug naar het nieuwtje"
      back_title: "Keer terug naar het nieuwtje waar u deze reactie bij heeft geplaatst"
    remove_comment:
      confirmation: "Weet u zeker dat u deze reactie wilt verwijderen?"
      confirm: "Ja, verwijderen"
      cancel: "Nee, niet verwijderen"


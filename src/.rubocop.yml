plugins:
  - rubocop-rails

AllCops:
  TargetRubyVersion: 3.3
  TargetRailsVersion: 7.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'db/schema.rb'
    - 'db/migrate/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'public/**/*'
    - 'script/**/*'
    - 'bin/**/*'
    - 'config/boot.rb'
    - 'config/environment.rb'

# Relax Metrics cops for a legacy Rails app.
Metrics/AbcSize:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Layout/LineLength:
  Max: 180

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

# Documentation is not required for every class/module.
Style/Documentation:
  Enabled: false

# Allow both single and double quotes.
Style/StringLiterals:
  Enabled: false

# Enabling would add `# frozen_string_literal: true` to every file; not worth the churn.
Style/FrozenStringLiteralComment:
  Enabled: false

# Legacy code uses `for ... in ...`; leave it alone.
Style/For:
  Enabled: false

# Existing controllers use non-predicate method names (e.g. `is_authorized`).
Naming/PredicatePrefix:
  Enabled: false

# Legacy helpers return booleans without a `?` suffix (e.g. `user_is_author`).
Naming/PredicateMethod:
  Enabled: false

# Existing regex literals use `/.../`; no need to switch to `%r{}`.
Style/RegexpLiteral:
  Enabled: false

# Legacy conditionals are easier to read as-is.
Style/GuardClause:
  Enabled: false

# Legacy code uses `class Foo::Bar`; leave the compact style alone.
Style/ClassAndModuleChildren:
  Enabled: false

# Legacy controllers rescue Exception intentionally to keep error flows wide.
Lint/RescueException:
  Enabled: false

# `rescue Exception => e` leaves `e` unused in a few places; harmless.
Lint/UselessAssignment:
  Enabled: false

# Existing user model mixes `private` with `self.` methods; refactor later.
Lint/UselessAccessModifier:
  Enabled: false
Lint/IneffectiveAccessModifier:
  Enabled: false

# `end` alignment on legacy `unless`/`if` blocks is inconsistent; refactor later.
Layout/EndAlignment:
  Enabled: false

# Legacy controllers nest blocks deeper than 3 levels.
Metrics/BlockNesting:
  Enabled: false

# The routes DSL is a single big block by design.
Metrics/BlockLength:
  Exclude:
    - 'config/routes.rb'

# The app has a single `Mailer` and no ApplicationMailer base class.
Rails/ApplicationMailer:
  Enabled: false

# Legacy code and tests use `update_attribute` to set single columns without
# running validations; refactor later.
Rails/SkipsModelValidations:
  Enabled: false

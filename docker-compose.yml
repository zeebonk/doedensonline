services:
    db:
        image: postgres:18-alpine
        environment:
            - POSTGRES_DB=doedensonline
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_USER=postgres
        volumes:
            - postgresql-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d doedensonline"]
            interval: 10s
            timeout: 5s
            retries: 6

    app:
        build: ./src
        image: 313336455033.dkr.ecr.eu-west-1.amazonaws.com/doedensonline:${TAG:-latest}
        environment:
            - DATABASE_HOST=db
            - DATABASE_NAME=doedensonline
            - DATABASE_PASSWORD=postgres
            - DATABASE_USERNAME=postgres
            - RAILS_ENV=development
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "127.0.0.1:8080:8080"
        volumes:
            - ./src:/app

volumes:
    postgresql-data:

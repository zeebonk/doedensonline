version: 2

# Not covered on purpose:
# - bundler (src/): every gem is exact-pinned and the app is on Rails 8.1,
#   whose security support ends 2027-10-10. One current gem release can't
#   be installed yet because Rails caps it (marcel). Gems are upgraded by
#   hand alongside Rails/Ruby upgrades (see the plan-rails-upgrade skill and
#   CLAUDE.md). Re-enabling this, with ignore rules for marcel and for Rails
#   minor/major bumps, is tracked as a follow-up of #243.
# - docker (src/Dockerfile): the only dependency is the ruby:4.0.7-alpine
#   base image. Ruby 4.0 is supported, so newer 4.0.x tags will appear, but
#   the Gemfile pins `ruby '4.0.7'` exactly, so a base-image bump on its own
#   would break `bundle install`. Add this back (ignoring major and minor
#   versions) once the Gemfile accepts 4.0.x patch releases.
# - docker-compose: docker-compose.yml only references our own ECR image.
# - mise.toml: Dependabot has no mise ecosystem, so the tool versions pinned
#   there (python, uv, opentofu, docker-compose) are bumped by hand.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /iac/server
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: opentofu
    directories:
      - /iac/server
      - /iac/app
    schedule:
      interval: weekly
    groups:
      opentofu:
        patterns: ["*"]

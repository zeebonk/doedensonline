version: 2

# Not covered on purpose:
# - docker-compose: docker-compose.yml only references our own ECR image.
# - mise.toml: Dependabot has no mise ecosystem, so the tool versions pinned
#   there (python, uv, opentofu, docker-compose) are bumped by hand.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /iac/server
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: opentofu
    directories:
      - /iac/server
      - /iac/app
    schedule:
      interval: weekly
    groups:
      opentofu:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: /src
    schedule:
      interval: weekly
    groups:
      bundler:
        patterns: ["*"]
    ignore:
      # Active Storage 8.1 requires marcel ~> 1.0.
      - dependency-name: marcel
        versions: [">= 2"]
      # Rails minor and major upgrades go through the plan-rails-upgrade
      # skill; patch releases are fine to take from here. action* also
      # matches action_text-trix, whose minor version Action Text caps anyway.
      - dependency-name: rails
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: railties
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: action*
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: active*
        update-types: [version-update:semver-minor, version-update:semver-major]

  # Only Ruby patch releases of the base image, which the Gemfile's
  # `ruby '~> x.y.z'` accepts. Minor and major Ruby upgrades also need the
  # Gemfile, Gemfile.lock and RuboCop's TargetRubyVersion to move, so they go
  # through the plan-rails-upgrade skill.
  - package-ecosystem: docker
    directory: /src
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-major]

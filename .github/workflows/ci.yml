name: CI

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

# Master pushes and releases get their own group, only PR pushes cancel
# earlier started builds.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  ECR_IMAGE: 313336455033.dkr.ecr.eu-west-1.amazonaws.com/doedensonline

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cache-from: ${{ steps.cache.outputs.cache-from }}
      cache-to-amd64: ${{ steps.cache.outputs.cache-to-amd64 }}
      cache-to-arm64: ${{ steps.cache.outputs.cache-to-arm64 }}
    steps:
      - name: Compute layer cache refs
        id: cache
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The first scope is the one written to.
          scopes="cache"
          if [ -n "${PR_NUMBER}" ]; then
            scopes="pr-${PR_NUMBER}-cache ${scopes}"
          fi

          {
            echo 'cache-from<<EOF'
            for scope in ${scopes}; do
              echo "type=registry,ref=${ECR_IMAGE}:${scope}-amd64"
              echo "type=registry,ref=${ECR_IMAGE}:${scope}-arm64"
            done
            echo 'EOF'
            echo "cache-to-amd64=type=registry,ref=${ECR_IMAGE}:${scopes%% *}-amd64,image-manifest=true,oci-mediatypes=true"
            echo "cache-to-arm64=type=registry,ref=${ECR_IMAGE}:${scopes%% *}-arm64,image-manifest=true,oci-mediatypes=true"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Register mise's docker-compose as a Docker CLI plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          ln -sf "$(mise where docker-compose)/docker-cli-plugin-docker-compose" \
            ~/.docker/cli-plugins/docker-compose

      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/github-actions
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: ./src
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.ECR_IMAGE }}:latest
          cache-from: ${{ needs.prepare.outputs.cache-from }}
          cache-to: ${{ needs.prepare.outputs[format('cache-to-{0}', matrix.arch)] }}

      # Lint results don't depend on the platform; run them once.
      - name: Run RuboCop
        if: matrix.arch == 'amd64'
        run: docker compose run --rm app bundle exec rubocop

      - name: Run i18n-tasks
        if: matrix.arch == 'amd64'
        run: docker compose run --rm app bundle exec i18n-tasks health

      - name: Run tests
        run: docker compose run --rm -e RAILS_ENV=test app bundle exec rails db:migrate test

  release:
    needs: [prepare, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Require all platform builds to succeed
        if: needs.build.result != 'success'
        run: |
          echo "::error::Platform builds did not all succeed (${{ needs.build.result }}); not publishing."
          exit 1

      - uses: actions/checkout@v7

      - name: Compute image tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${EVENT}" = "release" ]; then
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(echo "${BRANCH}" | tr '/' '-').$(git rev-parse --short "${SHA}")" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/github-actions
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # This step assumes that all layers are cached in the build stage and
      # therefore nothing actually gets built.
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ./src
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.ECR_IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: ${{ needs.prepare.outputs.cache-from }}

  tofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive

      - name: Validate server module
        working-directory: iac/server
        run: |
          tofu init -backend=false -input=false
          tofu validate

      # The app module only evaluates in the dev and prod workspaces.
      - name: Validate app module
        working-directory: iac/app
        run: |
          tofu init -backend=false -input=false
          TF_WORKSPACE=dev tofu validate
          TF_WORKSPACE=prod tofu validate

  ansible-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/server
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run ansible-lint
        run: uv run ansible-lint playbook.yaml

      - name: Check playbook syntax
        run: |
          uv run ansible-playbook --syntax-check -i localhost, -e target=localhost playbook.yaml

  # Master pushes deploy to dev, releases to prod.
  deploy:
    needs: [release, tofu, ansible-lint]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'release'
    concurrency:
      # The env context isn't available here.
      group: deploy-${{ github.event_name == 'release' && 'prod' || 'dev' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ github.event_name == 'release' && 'prod' || 'dev' }}
      # Prefix of the environment's GitHub Actions secrets.
      SECRETS: ${{ github.event_name == 'release' && 'PROD' || 'DEV' }}
    defaults:
      run:
        working-directory: iac/app
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/github-actions
          aws-region: eu-west-1

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets[format('{0}_SSH_PRIVATE_KEY', env.SECRETS)] }}
          SSH_HOST: ${{ secrets[format('{0}_SSH_HOST', env.SECRETS)] }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Initialize OpenTofu
        run: |
          tofu init -input=false
          tofu workspace select -or-create "${ENVIRONMENT}"

      - name: Deploy to ${{ env.ENVIRONMENT }}
        env:
          TF_VAR_ssh_host: ${{ secrets[format('{0}_SSH_HOST', env.SECRETS)] }}
          TF_VAR_image_tag: ${{ needs.release.outputs.tag }}
          TF_VAR_smtp_host: ${{ secrets[format('{0}_SMTP_HOST', env.SECRETS)] }}
          TF_VAR_smtp_username: ${{ secrets[format('{0}_SMTP_USERNAME', env.SECRETS)] }}
          TF_VAR_smtp_password: ${{ secrets[format('{0}_SMTP_PASSWORD', env.SECRETS)] }}
          TF_VAR_secret_key_base: ${{ secrets[format('{0}_SECRET_KEY_BASE', env.SECRETS)] }}
        run: tofu apply -input=false -auto-approve

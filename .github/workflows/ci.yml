name: CI

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

# Master pushes and releases get their own group, only PR pushes cancel
# earlier started builds.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  ECR_IMAGE: 313336455033.dkr.ecr.eu-west-1.amazonaws.com/doedensonline

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cache-from: ${{ steps.cache.outputs.cache-from }}
      cache-from-args: ${{ steps.cache.outputs.cache-from-args }}
      cache-to-amd64: ${{ steps.cache.outputs.cache-to-amd64 }}
      cache-to-arm64: ${{ steps.cache.outputs.cache-to-arm64 }}
    steps:
      - name: Compute layer cache refs
        id: cache
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The first scope is the one written to.
          scopes="cache"
          if [ -n "${PR_NUMBER}" ]; then
            scopes="pr-${PR_NUMBER}-cache ${scopes}"
          fi

          refs=""
          for scope in ${scopes}; do
            refs="${refs} type=registry,ref=${ECR_IMAGE}:${scope}-amd64"
            refs="${refs} type=registry,ref=${ECR_IMAGE}:${scope}-arm64"
          done

          {
            echo 'cache-from<<EOF'
            printf '%s\n' ${refs}
            echo 'EOF'
            # The same refs as arguments to the app:release task.
            echo "cache-from-args=$(printf -- '--cache-from %s ' ${refs})"
            echo "cache-to-amd64=type=registry,ref=${ECR_IMAGE}:${scopes%% *}-amd64,image-manifest=true,oci-mediatypes=true"
            echo "cache-to-arm64=type=registry,ref=${ECR_IMAGE}:${scopes%% *}-arm64,image-manifest=true,oci-mediatypes=true"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Register mise's docker-compose as a Docker CLI plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          ln -sf "$(mise where docker-compose)/docker-cli-plugin-docker-compose" \
            ~/.docker/cli-plugins/docker-compose

      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/github-actions-build
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: ./src
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.ECR_IMAGE }}:latest
          cache-from: ${{ needs.prepare.outputs.cache-from }}
          cache-to: ${{ needs.prepare.outputs[format('cache-to-{0}', matrix.arch)] }}

      # Lint results don't depend on the platform; run them once.
      - name: Lint Ruby
        if: matrix.arch == 'amd64'
        run: mise run app:lint

      - name: Run tests
        run: mise run app:test

  release:
    needs: [prepare, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Require all platform builds to succeed
        if: needs.build.result != 'success'
        run: |
          echo "::error::Platform builds did not all succeed (${{ needs.build.result }}); not publishing."
          exit 1

      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Compute image tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${EVENT}" = "release" ]; then
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(echo "${BRANCH}" | tr '/' '-').$(git rev-parse --short "${SHA}")" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/github-actions-build
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # This step assumes that all layers are cached in the build stage and
      # therefore nothing actually gets built.
      - name: Build and push multi-arch image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CACHE_FROM_ARGS: ${{ needs.prepare.outputs.cache-from-args }}
        # CACHE_FROM_ARGS is unquoted to split it into arguments; the refs
        # contain no spaces.
        run: mise run app:release "${TAG}" ${CACHE_FROM_ARGS}

  tofu:
    runs-on: ubuntu-latest
    env:
      # Avoids the anonymous rate limit on TFLint plugin downloads.
      GITHUB_TOKEN: ${{ github.token }}
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Lint iac/server
        run: mise run server:lint

      - name: Lint iac/app
        run: mise run deployment:lint

  # Master pushes deploy to dev, releases to prod.
  deploy:
    needs: [release, tofu]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'release'
    concurrency:
      # The env context isn't available here.
      group: deploy-${{ github.event_name == 'release' && 'prod' || 'dev' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Only master can deploy to dev and only release tags to prod. Only these
    # environments get the deploy secrets and the github-actions-deploy role.
    environment: ${{ github.event_name == 'release' && 'prod' || 'dev' }}
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ github.event_name == 'release' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/github-actions-deploy
          aws-region: eu-west-1

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy to ${{ env.ENVIRONMENT }}
        env:
          TF_VAR_ssh_host: ${{ secrets.SSH_HOST }}
          IMAGE_TAG: ${{ needs.release.outputs.tag }}
          TF_VAR_smtp_host: ${{ secrets.SMTP_HOST }}
          TF_VAR_smtp_username: ${{ secrets.SMTP_USERNAME }}
          TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_INPUT: "false"
          TF_CLI_ARGS_apply: -auto-approve
        run: mise run deployment:apply "${ENVIRONMENT}" "${IMAGE_TAG}"

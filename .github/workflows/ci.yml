name: CI

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

env:
  ECR_IMAGE: 313336455033.dkr.ecr.eu-west-1.amazonaws.com/doedensonline

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cache-from: ${{ steps.cache.outputs.cache-from }}
      cache-to-amd64: ${{ steps.cache.outputs.cache-to-amd64 }}
      cache-to-arm64: ${{ steps.cache.outputs.cache-to-arm64 }}
    steps:
      - name: Compute layer cache refs
        id: cache
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The first scope is the one written to.
          scopes="cache"
          if [ -n "${PR_NUMBER}" ]; then
            scopes="pr-${PR_NUMBER}-cache ${scopes}"
          fi

          {
            echo 'cache-from<<EOF'
            for scope in ${scopes}; do
              echo "type=registry,ref=${ECR_IMAGE}:${scope}-amd64"
              echo "type=registry,ref=${ECR_IMAGE}:${scope}-arm64"
            done
            echo 'EOF'
            echo "cache-to-amd64=type=registry,ref=${ECR_IMAGE}:${scopes%% *}-amd64,image-manifest=true,oci-mediatypes=true"
            echo "cache-to-arm64=type=registry,ref=${ECR_IMAGE}:${scopes%% *}-arm64,image-manifest=true,oci-mediatypes=true"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Register mise's docker-compose as a Docker CLI plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          ln -sf "$(mise where docker-compose)/docker-cli-plugin-docker-compose" \
            ~/.docker/cli-plugins/docker-compose

      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/github-actions
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: ./src
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.ECR_IMAGE }}:latest
          cache-from: ${{ needs.prepare.outputs.cache-from }}
          cache-to: ${{ needs.prepare.outputs[format('cache-to-{0}', matrix.arch)] }}

      # Lint results don't depend on the platform; run them once.
      - name: Run RuboCop
        if: matrix.arch == 'amd64'
        run: docker compose run --rm app bundle exec rubocop

      - name: Run i18n-tasks
        if: matrix.arch == 'amd64'
        run: docker compose run --rm app bundle exec i18n-tasks health

      - name: Run tests
        run: docker compose run --rm -e RAILS_ENV=test app bundle exec rails db:migrate test

  release:
    needs: [prepare, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Require all platform builds to succeed
        if: needs.build.result != 'success'
        run: |
          echo "::error::Platform builds did not all succeed (${{ needs.build.result }}); not publishing."
          exit 1

      - uses: actions/checkout@v7

      - name: Compute image tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${EVENT}" = "release" ]; then
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(echo "${BRANCH}" | tr '/' '-').$(git rev-parse --short "${SHA}")" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/github-actions
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # This step assumes that all layers are cached in the build stage and
      # therefore nothing actually gets built.
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ./src
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.ECR_IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: ${{ needs.prepare.outputs.cache-from }}

  tofu-fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive

  ansible-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run ansible-lint
        run: uv run ansible-lint playbook.yaml

      - name: Check playbook syntax
        run: |
          uv run ansible-playbook --syntax-check -i localhost, -e target=localhost playbook.yaml

  deploy-dev:
    needs: [release, tofu-fmt, ansible-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      APP_STATE_PATH: /app-state/dev
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy to dev
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          TAG: ${{ needs.release.outputs.tag }}
          SMTP_HOST: ${{ secrets.DEV_SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.DEV_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.DEV_SMTP_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.DEV_SECRET_KEY_BASE }}
        run: |
          ssh "root@${SSH_HOST}" bash -se <<REMOTE
          set -euo pipefail

          IMAGE="${ECR_IMAGE}:${TAG}"

          docker pull "\${IMAGE}"
          docker rm -f doedensonline-dev 2>/dev/null || true
          docker run -d \\
            --name doedensonline-dev \\
            --restart always \\
            -p 0.0.0.0:8080:8080 \\
            -e RAILS_ENV=development \\
            -e DO_SMTP_HOST='${SMTP_HOST}' \\
            -e DO_SMTP_USERNAME='${SMTP_USERNAME}' \\
            -e DO_SMTP_PASSWORD='${SMTP_PASSWORD}' \\
            -e SECRET_KEY_BASE='${SECRET_KEY_BASE}' \\
            -v '${APP_STATE_PATH}/db/development.sqlite3:/app/db/development.sqlite3:rw' \\
            -v '${APP_STATE_PATH}/db/production.sqlite3:/app/db/production.sqlite3:rw' \\
            -v '${APP_STATE_PATH}/small/:/app/public/images/small/' \\
            -v '${APP_STATE_PATH}/medium/:/app/public/images/medium/' \\
            -v '${APP_STATE_PATH}/large/:/app/public/images/large/' \\
            "\${IMAGE}"

          docker exec -e RAILS_ENV=development doedensonline-dev bundle exec rails db:migrate
          docker exec -e RAILS_ENV=development doedensonline-dev bundle exec rails db:seed
          REMOTE

  deploy-prod:
    needs: [release, tofu-fmt, ansible-lint]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      APP_STATE_PATH: /app-state/prod
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy to prod
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          TAG: ${{ needs.release.outputs.tag }}
          SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.PROD_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.PROD_SMTP_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.PROD_SECRET_KEY_BASE }}
        run: |
          ssh "root@${SSH_HOST}" bash -se <<REMOTE
          set -euo pipefail

          IMAGE="${ECR_IMAGE}:${TAG}"

          docker pull "\${IMAGE}"
          docker rm -f doedensonline-prod 2>/dev/null || true
          docker run -d \\
            --name doedensonline-prod \\
            --restart always \\
            -p 0.0.0.0:8081:8080 \\
            -e RAILS_ENV=production \\
            -e DO_SMTP_HOST='${SMTP_HOST}' \\
            -e DO_SMTP_USERNAME='${SMTP_USERNAME}' \\
            -e DO_SMTP_PASSWORD='${SMTP_PASSWORD}' \\
            -e SECRET_KEY_BASE='${SECRET_KEY_BASE}' \\
            -v '${APP_STATE_PATH}/db/development.sqlite3:/app/db/development.sqlite3:rw' \\
            -v '${APP_STATE_PATH}/db/production.sqlite3:/app/db/production.sqlite3:rw' \\
            -v '${APP_STATE_PATH}/small/:/app/public/images/small/' \\
            -v '${APP_STATE_PATH}/medium/:/app/public/images/medium/' \\
            -v '${APP_STATE_PATH}/large/:/app/public/images/large/' \\
            "\${IMAGE}"

          docker exec -e RAILS_ENV=production doedensonline-prod bundle exec rails db:migrate
          REMOTE

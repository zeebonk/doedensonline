name: CI

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REGISTRY: 313336455033.dkr.ecr.eu-west-1.amazonaws.com
      ECR_REPOSITORY: doedensonline
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v2

      - name: Compute image tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${EVENT}" = "release" ]; then
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(echo "${BRANCH}" | tr '/' '-').$(git rev-parse --short "${SHA}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Register mise's docker-compose as a Docker CLI plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          ln -sf "$(mise where docker-compose)/docker-cli-plugin-docker-compose" \
            ~/.docker/cli-plugins/docker-compose

      # The ruby:1.9.3-p551 base image still uses Docker Schema 1, which
      # containerd v2+ refuses by default. Re-enable it on the daemon.
      - name: Enable Schema 1 image pulls
        run: |
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nEnvironment="CONTAINERD_ENABLE_DEPRECATED_PULL_SCHEMA_1_IMAGE=1"\n' \
            | sudo tee /etc/systemd/system/docker.service.d/schema1.conf
          sudo systemctl daemon-reload
          sudo systemctl restart docker

      - name: Build app image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker compose build

      - name: Run RuboCop
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker compose run --rm app bundle exec rubocop

      - name: Run i18n-tasks
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker compose run --rm app bundle exec i18n-tasks health

      - name: Run tests
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker compose run --rm -e RAILS_ENV=test app bundle exec rake db:migrate test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/github-actions
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"

  tofu-fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v2

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive

  ansible-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run ansible-lint
        run: uv run ansible-lint playbook.yaml

      - name: Check playbook syntax
        run: |
          uv run ansible-playbook --syntax-check -i localhost, -e target=localhost playbook.yaml

  deploy-dev:
    needs: [ci, tofu-fmt, ansible-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: 313336455033.dkr.ecr.eu-west-1.amazonaws.com
      ECR_REPOSITORY: doedensonline
      APP_STATE_PATH: /app-state/dev
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy to dev
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          TAG: ${{ needs.ci.outputs.tag }}
          SMTP_HOST: ${{ secrets.DEV_SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.DEV_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.DEV_SMTP_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.DEV_SECRET_KEY_BASE }}
        run: |
          ssh "root@${SSH_HOST}" bash -se <<REMOTE
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"

          docker pull "\${IMAGE}"
          docker rm -f doedensonline-dev 2>/dev/null || true
          docker run -d \\
            --name doedensonline-dev \\
            --restart always \\
            -p 0.0.0.0:8080:8080 \\
            -e RAILS_ENV=development \\
            -e DO_SMTP_HOST='${SMTP_HOST}' \\
            -e DO_SMTP_USERNAME='${SMTP_USERNAME}' \\
            -e DO_SMTP_PASSWORD='${SMTP_PASSWORD}' \\
            -e SECRET_KEY_BASE='${SECRET_KEY_BASE}' \\
            -v '${APP_STATE_PATH}/db/development.sqlite3:/app/db/development.sqlite3:rw' \\
            -v '${APP_STATE_PATH}/db/production.sqlite3:/app/db/production.sqlite3:rw' \\
            -v '${APP_STATE_PATH}/small/:/app/public/images/small/' \\
            -v '${APP_STATE_PATH}/medium/:/app/public/images/medium/' \\
            -v '${APP_STATE_PATH}/large/:/app/public/images/large/' \\
            "\${IMAGE}"

          docker exec -e RAILS_ENV=development doedensonline-dev rake db:migrate
          docker exec -e RAILS_ENV=development doedensonline-dev rake db:seed
          REMOTE

  deploy-prod:
    needs: [ci, tofu-fmt, ansible-lint]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: 313336455033.dkr.ecr.eu-west-1.amazonaws.com
      ECR_REPOSITORY: doedensonline
      APP_STATE_PATH: /app-state/prod
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy to prod
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          TAG: ${{ needs.ci.outputs.tag }}
          SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.PROD_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.PROD_SMTP_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.PROD_SECRET_KEY_BASE }}
        run: |
          ssh "root@${SSH_HOST}" bash -se <<REMOTE
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"

          docker pull "\${IMAGE}"
          docker rm -f doedensonline-prod 2>/dev/null || true
          docker run -d \\
            --name doedensonline-prod \\
            --restart always \\
            -p 0.0.0.0:8081:8080 \\
            -e RAILS_ENV=production \\
            -e DO_SMTP_HOST='${SMTP_HOST}' \\
            -e DO_SMTP_USERNAME='${SMTP_USERNAME}' \\
            -e DO_SMTP_PASSWORD='${SMTP_PASSWORD}' \\
            -e SECRET_KEY_BASE='${SECRET_KEY_BASE}' \\
            -v '${APP_STATE_PATH}/db/development.sqlite3:/app/db/development.sqlite3:rw' \\
            -v '${APP_STATE_PATH}/db/production.sqlite3:/app/db/production.sqlite3:rw' \\
            -v '${APP_STATE_PATH}/small/:/app/public/images/small/' \\
            -v '${APP_STATE_PATH}/medium/:/app/public/images/medium/' \\
            -v '${APP_STATE_PATH}/large/:/app/public/images/large/' \\
            "\${IMAGE}"

          docker exec -e RAILS_ENV=production doedensonline-prod rake db:migrate
          REMOTE

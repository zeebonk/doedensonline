name: CI

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

jobs:
  # Builds, tests, and pushes the image for each platform on a native runner.
  # Images are pushed by digest only (untagged); the `ci` job below tags them
  # together once every platform has succeeded, so a failure on one platform
  # never publishes a tag. Orphaned untagged digests are expired by the ECR
  # lifecycle policy.
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REGISTRY: 313336455033.dkr.ecr.eu-west-1.amazonaws.com
      ECR_REPOSITORY: doedensonline
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4

      - name: Register mise's docker-compose as a Docker CLI plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          ln -sf "$(mise where docker-compose)/docker-cli-plugin-docker-compose" \
            ~/.docker/cli-plugins/docker-compose

      # The ruby:1.9.3-p551 base image still uses Docker Schema 1, which
      # containerd v2+ refuses by default. Re-enable it on the daemon.
      - name: Enable Schema 1 image pulls
        run: |
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nEnvironment="CONTAINERD_ENABLE_DEPRECATED_PULL_SCHEMA_1_IMAGE=1"\n' \
            | sudo tee /etc/systemd/system/docker.service.d/schema1.conf
          sudo systemctl daemon-reload
          sudo systemctl restart docker

      # Set up (and switch to) a BuildKit builder so the layers built by
      # `docker compose build` are reused by the push below. This must come
      # after the Docker daemon restart above.
      - uses: docker/setup-buildx-action@v3

      # Built for the runner's native platform and loaded into the local
      # Docker engine for the lint and test steps.
      - name: Build app image
        run: docker compose build

      # Lint results don't depend on the platform; run them once.
      - name: Run RuboCop
        if: matrix.arch == 'amd64'
        run: docker compose run --rm app bundle exec rubocop

      - name: Run i18n-tasks
        if: matrix.arch == 'amd64'
        run: docker compose run --rm app bundle exec i18n-tasks health

      - name: Run tests
        run: docker compose run --rm -e RAILS_ENV=test app bundle exec rake db:migrate test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/github-actions
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./src
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags the per-platform digests as a single multi-arch image. Named `ci`
  # because it is the required status check on master. It runs even when a
  # build fails (a job skipped through `needs` would count as passing) and
  # fails itself in that case, without tagging anything.
  ci:
    needs: [build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REGISTRY: 313336455033.dkr.ecr.eu-west-1.amazonaws.com
      ECR_REPOSITORY: doedensonline
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Require all platform builds to succeed
        if: needs.build.result != 'success'
        run: |
          echo "::error::Platform builds did not all succeed (${{ needs.build.result }}); not publishing."
          exit 1

      - uses: actions/checkout@v5

      - name: Compute image tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${EVENT}" = "release" ]; then
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(echo "${BRANCH}" | tr '/' '-').$(git rev-parse --short "${SHA}")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/github-actions
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag multi-arch image in ECR
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sources=()
          for digest in *; do
            sources+=("${ECR_REGISTRY}/${ECR_REPOSITORY}@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"

  tofu-fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive

  ansible-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run ansible-lint
        run: uv run ansible-lint playbook.yaml

      - name: Check playbook syntax
        run: |
          uv run ansible-playbook --syntax-check -i localhost, -e target=localhost playbook.yaml

  deploy-dev:
    needs: [ci, tofu-fmt, ansible-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: 313336455033.dkr.ecr.eu-west-1.amazonaws.com
      ECR_REPOSITORY: doedensonline
      APP_STATE_PATH: /app-state/dev
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy to dev
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          TAG: ${{ needs.ci.outputs.tag }}
          SMTP_HOST: ${{ secrets.DEV_SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.DEV_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.DEV_SMTP_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.DEV_SECRET_KEY_BASE }}
        run: |
          ssh "root@${SSH_HOST}" bash -se <<REMOTE
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"

          docker pull "\${IMAGE}"
          docker rm -f doedensonline-dev 2>/dev/null || true
          docker run -d \\
            --name doedensonline-dev \\
            --restart always \\
            -p 0.0.0.0:8080:8080 \\
            -e RAILS_ENV=development \\
            -e DO_SMTP_HOST='${SMTP_HOST}' \\
            -e DO_SMTP_USERNAME='${SMTP_USERNAME}' \\
            -e DO_SMTP_PASSWORD='${SMTP_PASSWORD}' \\
            -e SECRET_KEY_BASE='${SECRET_KEY_BASE}' \\
            -v '${APP_STATE_PATH}/db/development.sqlite3:/app/db/development.sqlite3:rw' \\
            -v '${APP_STATE_PATH}/db/production.sqlite3:/app/db/production.sqlite3:rw' \\
            -v '${APP_STATE_PATH}/small/:/app/public/images/small/' \\
            -v '${APP_STATE_PATH}/medium/:/app/public/images/medium/' \\
            -v '${APP_STATE_PATH}/large/:/app/public/images/large/' \\
            "\${IMAGE}"

          docker exec -e RAILS_ENV=development doedensonline-dev rake db:migrate
          docker exec -e RAILS_ENV=development doedensonline-dev rake db:seed
          REMOTE

  deploy-prod:
    needs: [ci, tofu-fmt, ansible-lint]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: 313336455033.dkr.ecr.eu-west-1.amazonaws.com
      ECR_REPOSITORY: doedensonline
      APP_STATE_PATH: /app-state/prod
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy to prod
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          TAG: ${{ needs.ci.outputs.tag }}
          SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.PROD_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.PROD_SMTP_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.PROD_SECRET_KEY_BASE }}
        run: |
          ssh "root@${SSH_HOST}" bash -se <<REMOTE
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"

          docker pull "\${IMAGE}"
          docker rm -f doedensonline-prod 2>/dev/null || true
          docker run -d \\
            --name doedensonline-prod \\
            --restart always \\
            -p 0.0.0.0:8081:8080 \\
            -e RAILS_ENV=production \\
            -e DO_SMTP_HOST='${SMTP_HOST}' \\
            -e DO_SMTP_USERNAME='${SMTP_USERNAME}' \\
            -e DO_SMTP_PASSWORD='${SMTP_PASSWORD}' \\
            -e SECRET_KEY_BASE='${SECRET_KEY_BASE}' \\
            -v '${APP_STATE_PATH}/db/development.sqlite3:/app/db/development.sqlite3:rw' \\
            -v '${APP_STATE_PATH}/db/production.sqlite3:/app/db/production.sqlite3:rw' \\
            -v '${APP_STATE_PATH}/small/:/app/public/images/small/' \\
            -v '${APP_STATE_PATH}/medium/:/app/public/images/medium/' \\
            -v '${APP_STATE_PATH}/large/:/app/public/images/large/' \\
            "\${IMAGE}"

          docker exec -e RAILS_ENV=production doedensonline-prod rake db:migrate
          REMOTE

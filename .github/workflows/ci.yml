name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      # The ruby:1.9.3-p551 base image still uses Docker Schema 1, which
      # containerd v2+ refuses by default. Re-enable it on the daemon.
      - name: Enable Schema 1 image pulls
        run: |
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nEnvironment="CONTAINERD_ENABLE_DEPRECATED_PULL_SCHEMA_1_IMAGE=1"\n' \
            | sudo tee /etc/systemd/system/docker.service.d/schema1.conf
          sudo systemctl daemon-reload
          sudo systemctl restart docker

      - name: Build app image
        run: docker compose build

      - name: Run RuboCop
        run: docker compose run --rm app bundle exec rubocop

      - name: Run tests
        run: docker compose run --rm -e RAILS_ENV=test app bundle exec rake db:migrate test

  tofu-fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive

  ansible-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible and ansible-lint
        run: pip install ansible==8.5.0 ansible-lint

      - name: Run ansible-lint
        run: ansible-lint playbook.yaml sync.yaml

      - name: Check playbook syntax
        run: |
          ansible-playbook --syntax-check -i localhost, -e target=localhost playbook.yaml
          ansible-playbook --syntax-check -i localhost, -e target=localhost sync.yaml

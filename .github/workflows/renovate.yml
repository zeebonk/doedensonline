name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # Dry run only: Renovate resolves and logs the updates it would make,
      # but doesn't create branches, PRs, or issues.
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: debug
          RENOVATE_DRY_RUN: full
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # No renovate.json in the repo yet; scan with defaults instead of
          # stopping at the onboarding step.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: optional

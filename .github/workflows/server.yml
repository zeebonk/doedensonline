name: Server

# Plans iac/server on pull requests, applies it on master.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    # Fork and Dependabot pull requests get no environment secrets, so their
    # runs would wait for an approval only to fail.
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.head.repo.fork &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    # Only these environments can assume github-actions-server. Pull requests
    # need an approval, since any branch can edit this workflow. Master
    # doesn't: it only changes through pull requests with an approved plan.
    environment: ${{ github.event_name == 'pull_request' && 'server-plan' || 'server' }}
    # Plans hold the state lock too, and a cancelled run can leave it behind.
    concurrency:
      group: server-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: iac/server
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/github-actions-server
          aws-region: eu-west-1

      - name: Initialize OpenTofu
        run: tofu init -input=false

      - name: Plan
        id: plan
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.SERVER_GITHUB_TOKEN }}
        run: |
          # -detailed-exitcode: 0 means no changes, 2 means changes pending.
          code=0
          tofu plan -input=false -lock-timeout=10m -detailed-exitcode -out=server.tfplan || code=$?
          case "${code}" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "${code}" ;;
          esac

          {
            echo '```text'
            tofu show -no-color server.tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: github.ref == 'refs/heads/master' && steps.plan.outputs.changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.SERVER_GITHUB_TOKEN }}
        run: tofu apply -input=false -lock-timeout=10m server.tfplan

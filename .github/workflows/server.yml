name: Server

# Plans iac/server on pull requests, applies it on master.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    # Fork and Dependabot pull requests get no environment secrets or OIDC
    # token.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    # Only `server` (master only) can assume the admin role; `server-plan`
    # (any branch) gets the read-only role.
    environment: ${{ github.ref == 'refs/heads/master' && 'server' || 'server-plan' }}
    # A newer master run applies everything an older pending one would, so
    # one apply at a time is enough. Branch plans cancel older ones.
    concurrency:
      group: server-${{ github.ref == 'refs/heads/master' && 'apply' || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    permissions:
      id-token: write
      contents: read
    env:
      APPLY: ${{ github.ref == 'refs/heads/master' }}
    defaults:
      run:
        working-directory: iac/server
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313336455033:role/${{ github.ref == 'refs/heads/master' && 'github-actions-server' || 'github-actions-server-plan' }}
          aws-region: eu-west-1

      - name: Initialize OpenTofu
        run: tofu init -input=false

      # The plan file holds secrets in plain text, so it never leaves this
      # job; the apply below uses it directly.
      - name: Plan
        id: plan
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.SERVER_GITHUB_TOKEN }}
        run: |
          # The read-only plan role can't write the S3 lockfile.
          if [ "${APPLY}" = "true" ]; then
            lock="-lock-timeout=10m"
          else
            lock="-lock=false"
          fi

          # -detailed-exitcode: 0 means no changes, 2 means changes pending.
          code=0
          tofu plan -input=false "${lock}" -detailed-exitcode -out=server.tfplan || code=$?
          case "${code}" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "${code}" ;;
          esac

          {
            echo '```text'
            tofu show -no-color server.tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Variables come from the plan file; only the providers need
      # credentials again.
      - name: Apply
        if: env.APPLY == 'true' && steps.plan.outputs.changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.SERVER_GITHUB_TOKEN }}
        run: tofu apply -input=false -lock-timeout=10m server.tfplan

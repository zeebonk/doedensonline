- name: Ensure webservers are configured
  hosts: "{{ target | mandatory }}"
  tasks:

   - name: Ensure dependencies are installed
     ansible.builtin.apt:
       name:
        - htop
        - vim
        - amazon-ecr-credential-helper
        - python3-requests  # Required by the Docker module
       state: present

   - name: Ensure Docker is running
     ansible.builtin.service:
       enabled: true
       name: docker
       state: started

   - name: Ensure Docker rotates container logs
     ansible.builtin.copy:
       content: |
         {
           "log-driver": "json-file",
           "log-opts": {
             "max-size": "10m",
             "max-file": "5"
           }
         }
       dest: /etc/docker/daemon.json
       owner: root
       group: root
       mode: '0644'
     notify: Restart Docker

   # Restart before the containers below are created, so they get the log
   # settings.
   - name: Flush handlers
     ansible.builtin.meta: flush_handlers

   - name: Ensure ~/.docker/ exists
     file:
       path: ~/.docker/
       state: directory

   - name: Ensure Docker is configured to login in ECR
     ansible.builtin.template:
       src: ./docker-config.json
       dest: ~/.docker/config.json
       owner: root
       group: root
       mode: '0777'  # TODO: better permissions

   - name: Ensure ~/.aws/ exists
     ansible.builtin.file:
       path: ~/.aws/
       state: directory
       mode: '0700'

   - name: Ensure AWS credentials for ECR pulls are present
     ansible.builtin.copy:
       content: |
         [default]
         aws_access_key_id = {{ ecr_access_key_id }}
         aws_secret_access_key = {{ ecr_secret_access_key }}
       dest: ~/.aws/credentials
       owner: root
       group: root
       mode: '0600'
     no_log: true

   - name: Ensure cloudflared tunnel is running
     community.docker.docker_container:
       name: "cloudflared-{{ instance }}"
       image: cloudflare/cloudflared:latest
       restart_policy: always
       network_mode: host
       command: tunnel --no-autoupdate run --token {{ cloudflared_tunnel_token }}
     when: cloudflared_tunnel_token is defined
     no_log: true

  handlers:

   - name: Restart Docker
     ansible.builtin.service:
       name: docker
       state: restarted

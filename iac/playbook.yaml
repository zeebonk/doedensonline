- name: Ensure webservers are configured
  hosts: "{{ target | mandatory }}"
  tasks:

   - name: Ensure dependencies are installed
     ansible.builtin.package:
       name:
        - htop
        - vim
        - docker
        - amazon-ecr-credential-helper
       state: present
     when: 0 > 1  # Disabled: not enough memory to run `yum` :(

   - name: Ensure dependencies are installed (Debian)
     ansible.builtin.apt:
       name:
        - htop
        - vim
        - amazon-ecr-credential-helper
       state: present
     when: ansible_os_family == 'Debian'

   - name: Ensure app state volume is xfs
     community.general.filesystem:
       fstype: xfs
       dev: "{{ app_state_device }}"
     when: app_state_device is defined

   - name: Ensure app state volume is mounted
     ansible.posix.mount:
       path: /app-state
       src: "{{ app_state_device }}"
       fstype: xfs
       opts: defaults,nofail
       state: mounted
     when: app_state_device is defined

   - name: Ensure /app-state has the right permissions
     ansible.builtin.file:
       path: /app-state
       owner: root
       group: root
       state: directory
       mode: '777'  # TODO: better permissions

   - name: Ensure app state subdirectories exist
     ansible.builtin.file:
       path: "{{ app_state_path }}/{{ item }}"
       state: directory
       owner: root
       group: root
       mode: '777'  # TODO: better permissions
     loop:
       - db
       - small
       - medium
       - large

   - name: Ensure sqlite database files exist
     ansible.builtin.file:
       path: "{{ app_state_path }}/db/{{ item }}.sqlite3"
       state: touch
       owner: root
       group: root
       mode: '777'  # TODO: better permissions
       modification_time: preserve
       access_time: preserve
     loop:
       - development
       - production

   - name: Ensure Docker is running
     ansible.builtin.service:
       enabled: true
       name: docker
       state: started

   - name: Ensure ~/.docker/ exists
     file:
       path: ~/.docker/
       state: directory

   - name: Ensure Docker is configured to login in ECR
     ansible.builtin.template:
       src: ./docker-config.json
       dest: ~/.docker/config.json
       owner: root
       group: root
       mode: '0777'  # TODO: better permissions

   - name: Ensure requests is installed  # Required by the Docker module
     ansible.builtin.pip:
       name: requests
     when: ansible_os_family != 'Debian'

   - name: Ensure python3-requests is installed (Debian)  # Required by the Docker module
     ansible.builtin.apt:
       name: python3-requests
       state: present
     when: ansible_os_family == 'Debian'

   - name: Ensure ~/.aws/ exists
     ansible.builtin.file:
       path: ~/.aws/
       state: directory
       mode: '0700'
     when: ecr_access_key_id is defined

   - name: Ensure AWS credentials for ECR pulls are present
     ansible.builtin.copy:
       content: |
         [default]
         aws_access_key_id = {{ ecr_access_key_id }}
         aws_secret_access_key = {{ ecr_secret_access_key }}
       dest: ~/.aws/credentials
       owner: root
       group: root
       mode: '0600'
     when: ecr_access_key_id is defined
     no_log: true

   - name: Ensure the webserver is running
     community.docker.docker_container:
       name: doedensonline
       image: "313336455033.dkr.ecr.eu-west-1.amazonaws.com/doedensonline:{{ image_tag }}"
       restart_policy: always
       published_ports:
        - 0.0.0.0:8080:8080
       env:
         RAILS_ENV: "{{ rails_env }}"
         DO_SMTP_HOST: "{{ smtp_host }}"
         DO_SMTP_USERNAME: "{{ smtp_username }}"
         DO_SMTP_PASSWORD: "{{ smtp_password }}"
       volumes:
        - "{{ app_state_path }}/db/development.sqlite3:/app/db/development.sqlite3:rw"
        - "{{ app_state_path }}/db/production.sqlite3:/app/db/production.sqlite3:rw"
        - "{{ app_state_path }}/small/:/app/public/images/small/"
        - "{{ app_state_path }}/medium/:/app/public/images/medium/"
        - "{{ app_state_path }}/large/:/app/public/images/large/"

   - name: Ensure database schema is up to date
     community.docker.docker_container_exec:
       container: doedensonline
       command: rake db:migrate
       env:
         RAILS_ENV: "{{ rails_env }}"
     when: rails_env == 'development'

   - name: Ensure database is seeded
     community.docker.docker_container_exec:
       container: doedensonline
       command: rake db:seed
       env:
         RAILS_ENV: "{{ rails_env }}"
     when: rails_env == 'development'

   - name: Ensure proxy configuration is present
     ansible.builtin.template:
       src: ./nginx.conf.j2
       dest: ~/nginx.conf
       owner: root
       group: root
       mode: '0777'  # TODO: better permissions
     notify:
       - Restart proxy

   - name: Ensure the proxy is running
     community.docker.docker_container:
       name: proxy
       image: nginx
       restart_policy: always
       published_ports:
        - 0.0.0.0:80:8080
        - 0.0.0.0:443:443
       volumes:
        - /root/nginx.conf:/etc/nginx/nginx.conf
        - "/etc/letsencrypt/live/{{ domain }}/fullchain.pem:/app/doedensonline-certificate.pem"
        - "/etc/letsencrypt/live/{{ domain }}/privkey.pem:/app/doedensonline-certificate-key.pem"
       etc_hosts:
        host.docker.internal: host-gateway

   - name: Ensure certificate renewal is scheduled
     ansible.builtin.cron:
       name: "Renew certificates"
       hour: 2
       minute: 0
       job: >
         docker stop proxy
         &&
         docker run --rm --name certbot
         -v "/etc/letsencrypt:/etc/letsencrypt"
         -v "/var/lib/letsencrypt:/var/lib/letsencrypt"
         -p 80:80
         certbot/certbot certonly -d {{ ([domain] + extra_domains) | join(',') }} --standalone -n
         &&
         docker start proxy

  handlers:
    - name: Restart proxy
      community.docker.docker_container:
        name: proxy
        image: nginx
        restart: yes
